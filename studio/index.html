<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>节拍台</title>
  <style>
    :root {
      --bg: #10110e;
      --bg-2: #181a15;
      --panel: #1c1e18;
      --ink: #f4f1e6;
      --muted: #9a9688;
      --line: rgba(244, 241, 230, 0.1);
      --lime: #dff25a;
      --lime-2: #c6dc3d;
      --ink-on: #1a1c0c;
      --hot: #ff5d3a;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      --serif: "Palatino Linotype", Palatino, "Songti SC", "Noto Serif SC", serif;
      --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "Cascadia Mono", "Sarasa Mono SC", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(223, 242, 90, 0.08), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0.01em;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 22px 8px;
      max-width: 1440px;
      margin: 0 auto;
    }
    .brand { display: flex; flex-direction: column; gap: 2px; min-width: 140px; }
    .brand b {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .brand span { color: var(--muted); font-size: 13px; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      color: var(--muted);
      font-size: 13px;
      background: rgba(255,255,255,0.02);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 0 4px rgba(255,93,58,0.15); }
    .status.on { color: #d7e7a4; }
    .status.on .dot { background: var(--lime); box-shadow: 0 0 0 4px rgba(223,242,90,0.15); }
    .spacer { flex: 1; }
    .layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 360px;
      gap: 16px;
      max-width: 1440px;
      margin: 0 auto;
      padding: 12px 22px 36px;
    }
    .panel {
      background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent 80px), var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
    }
    .side, .composer, .stage { padding: 16px; }
    .side { max-height: calc(100vh - 96px); overflow: auto; }
    .kicker {
      margin: 16px 2px 8px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 650;
    }
    .group-head { display: flex; flex-direction: column; gap: 2px; margin: 8px 2px 10px; }
    .group-head b { font-size: 14px; font-weight: 700; }
    .group-head span { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .side::-webkit-scrollbar, .list::-webkit-scrollbar { width: 8px; }
    .side::-webkit-scrollbar-thumb, .list::-webkit-scrollbar-thumb {
      background: rgba(244, 241, 230, 0.16);
      border-radius: 99px;
    }
    .preset {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      background: var(--bg-2);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .preset:hover { border-color: rgba(223, 242, 90, 0.35); }
    .preset.active {
      border-color: transparent;
      background: #262b12;
      box-shadow: inset 3px 0 0 var(--lime);
    }
    .idx { font-family: var(--mono); color: var(--lime); font-size: 12px; }
    .preset strong { display: block; font-size: 14px; font-weight: 650; }
    .preset em { display: block; margin-top: 2px; color: var(--muted); font-style: normal; font-size: 12px; }
    .tag {
      font-size: 11px;
      color: var(--ink-on);
      background: var(--lime);
      border-radius: 999px;
      padding: 3px 7px;
      white-space: nowrap;
    }
    .tag.ghost { color: var(--muted); background: transparent; border: 1px solid var(--line); }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab, .ghost-btn, .play, .gen {
      border: 0;
      border-radius: 999px;
    }
    .tab {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 8px 14px;
    }
    .tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    label.field { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 13px; }
    input[type="checkbox"] { accent-color: var(--lime); width: 15px; height: 15px; }
    textarea, input[type="number"], input[type="text"], select {
      width: 100%;
      background: #12140f;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      outline: none;
    }
    textarea { min-height: 148px; resize: vertical; line-height: 1.55; }
    textarea.lyrics { min-height: 180px; }
    textarea:focus, input:focus, select:focus { border-color: rgba(223,242,90,0.7); }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .checks { display: flex; gap: 16px; align-items: center; margin: 12px 0; color: var(--muted); font-size: 13px; }
    .checks label { display: flex; gap: 8px; align-items: center; }
    .actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
    .gen {
      background: var(--lime);
      color: var(--ink-on);
      padding: 12px 18px;
      font-weight: 700;
    }
    .gen:disabled { opacity: 0.45; cursor: not-allowed; }
    .ghost-btn {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 10px 14px;
    }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 10px 0 0; }
    .toast {
      min-height: 22px;
      margin-top: 10px;
      color: var(--lime);
      font-size: 13px;
    }
    .toast.bad { color: #ffb1a2; }
    .stage { display: flex; flex-direction: column; gap: 12px; }
    .viz-wrap {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 120%, rgba(223,242,90,0.18), transparent 46%),
        #10120d;
      border: 1px solid var(--line);
      height: 180px;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .now { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .now h2 { margin: 0; font-family: var(--serif); font-size: 26px; font-weight: 600; }
    .now p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    .transport { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
    .play {
      width: 64px; height: 64px;
      background: var(--lime);
      color: var(--ink-on);
      font-size: 14px;
      font-weight: 700;
    }
    .viz-label {
      position: absolute;
      left: 14px;
      top: 12px;
      z-index: 1;
      font-size: 12px;
      color: rgba(244, 241, 230, 0.72);
      letter-spacing: 0.08em;
    }
    .seek { width: 100%; accent-color: var(--lime); }
    .time { display: flex; justify-content: space-between; color: var(--muted); font-family: var(--mono); font-size: 12px; }
    .list { max-height: 280px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
    .track {
      text-align: left;
      background: #14160f;
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 8px 10px;
    }
    .track.on { border-color: var(--lime); }
    .track b { display: block; font-weight: 600; font-size: 13px; }
    .track span { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px; }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      .side { max-height: none; }
      header { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <b>节拍台</b>
      <span>提示词 · 试听 · 生成</span>
    </div>
    <div class="status" id="status"><i class="dot"></i><span>正在检查生成服务</span></div>
    <div class="spacer"></div>
    <button class="gen" id="genTop" type="button">生成并试听</button>
  </header>
  <main class="layout">
    <aside class="panel side" id="presets"></aside>
    <section class="panel composer">
      <div class="tabs">
        <button class="tab on" type="button" data-mode="caption">风格提示词</button>
        <button class="tab" type="button" data-mode="simple">一句话描述</button>
      </div>
      <div id="captionBox">
        <label class="field" for="prompt">风格提示词</label>
        <textarea id="prompt" placeholder="写清楚风格、乐器和情绪。例如：阴冷钻头节奏，滑动低音，冷铃，没有前奏"></textarea>
        <div id="lyricsWrap">
          <label class="field" for="lyrics">歌词</label>
          <textarea class="lyrics" id="lyrics" placeholder="[主歌]&#10;……&#10;&#10;[副歌]&#10;……"></textarea>
        </div>
        <p class="hint" id="lyricNote">纯伴奏可以留空。</p>
      </div>
      <div id="simpleBox" hidden>
        <label class="field" for="description">想听什么</label>
        <textarea id="description" placeholder="一首适合夜里走路的温柔国语歌，女声，钢琴"></textarea>
      </div>
      <div class="row">
        <div>
          <label class="field" for="bpm">速度</label>
          <input id="bpm" type="number" min="40" max="220" value="120">
        </div>
        <div>
          <label class="field" for="duration">时长（秒）</label>
          <input id="duration" type="number" min="10" max="240" value="45">
        </div>
        <div>
          <label class="field" for="language">演唱语言</label>
          <select id="language">
            <option value="zh">中文</option>
            <option value="en">英文</option>
            <option value="ja">日文</option>
            <option value="ko">韩文</option>
            <option value="yue">粤语</option>
          </select>
        </div>
      </div>
      <div class="checks">
        <label><input id="instrumental" type="checkbox"> 只要伴奏</label>
        <label><input id="thinking" type="checkbox"> 更高质量（更慢）</label>
      </div>
      <div class="actions">
        <button class="gen" id="gen" type="button">生成并试听</button>
        <button class="ghost-btn" id="stop" type="button" hidden>停止等待</button>
        <button class="ghost-btn" id="clear" type="button">清空</button>
      </div>
      <p class="hint">点左边的风格会填入中文提示词。标了「可试听」的会马上播放样例。生成大约要一两分钟，完成后出现在右侧。</p>
      <div class="toast" id="toast"></div>
    </section>
    <section class="panel stage">
      <div class="viz-wrap"><span class="viz-label">波形</span><canvas id="viz"></canvas></div>
      <div class="now">
        <div>
          <h2 id="trackTitle">还没有在播</h2>
          <p id="trackMeta">选一个风格，或生成一首新的</p>
        </div>
      </div>
      <div class="transport">
        <button class="play" id="play" type="button" aria-label="播放">播放</button>
        <div>
          <input class="seek" id="seek" type="range" min="0" max="1000" value="0">
          <div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        </div>
      </div>
      <div>
        <div class="kicker">刚刚生成</div>
        <div class="list" id="generated"><div class="empty">生成完成后会出现在这里</div></div>
        <div class="kicker">本地样例</div>
        <div class="list" id="samples"></div>
      </div>
    </section>
  </main>
  <audio id="audio" preload="metadata"></audio>
  <script>
    const $ = (id) => document.getElementById(id);
    const audio = $("audio");
    const state = { mode: "caption", presetId: "", task: null, timer: null, started: 0, playingUrl: "" };
    let catalog = { groups: [], presets: [] };
    let audioCtx, analyser, dataArray, raf;

    function fmt(sec) {
      if (!Number.isFinite(sec)) return "0:00";
      const s = Math.max(0, Math.floor(sec));
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }
    function toast(text, bad) {
      const el = $("toast");
      el.textContent = text || "";
      el.classList.toggle("bad", !!bad);
    }
    function draft() {
      return {
        mode: state.mode,
        presetId: state.presetId,
        prompt: $("prompt").value,
        lyrics: $("lyrics").value,
        description: $("description").value,
        bpm: $("bpm").value,
        duration: $("duration").value,
        language: $("language").value,
        instrumental: $("instrumental").checked,
        thinking: $("thinking").checked,
      };
    }
    function saveDraft() {
      localStorage.setItem("beat-studio-draft-v2", JSON.stringify(draft()));
    }
    function applyPreset(p, playSample) {
      state.presetId = p.id;
      state.mode = "caption";
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("on", tab.dataset.mode === "caption"));
      $("captionBox").hidden = false;
      $("simpleBox").hidden = true;
      $("prompt").value = p.prompt || "";
      $("lyrics").value = p.lyrics || "";
      $("description").value = p.blurb || "";
      $("bpm").value = p.bpm;
      $("duration").value = p.duration;
      $("language").value = p.language || "en";
      $("instrumental").checked = !!p.instrumental;
      $("thinking").checked = !!p.thinking;
      document.querySelectorAll(".preset").forEach((el) => el.classList.toggle("active", el.dataset.id === p.id));
      saveDraft();
      if (p.sample) loadTrack("/media/" + p.sample, p.name, p.bpm + " 拍 · 样例", !!playSample);
      syncLyricNote();
    }
    function syncLyricNote() {
      const note = $("lyricNote");
      const instrumental = $("instrumental").checked;
      $("lyricsWrap").hidden = instrumental;
      $("lyrics").disabled = instrumental;
      note.textContent = instrumental
        ? "当前是伴奏，不用写歌词。"
        : "歌词会按你写下的文字来唱。段落可以用「主歌」「副歌」。";
    }
    function renderPresets() {
      const root = $("presets");
      root.innerHTML = "";
      catalog.groups.forEach((group) => {
        const title = document.createElement("div");
        title.className = "group-head";
        const name = document.createElement("b");
        name.textContent = group.name;
        const note = document.createElement("span");
        note.textContent = group.note || "";
        title.append(name, note);
        root.appendChild(title);
        catalog.presets.filter((p) => p.group === group.id).forEach((p, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "preset";
          btn.dataset.id = p.id;
          btn.innerHTML = `<span class="idx">${String(i + 1).padStart(2, "0")}</span><span><strong></strong><em></em></span>`;
          btn.querySelector("strong").textContent = p.name;
          btn.querySelector("em").textContent = p.blurb;
          const tag = document.createElement("span");
          tag.className = "tag" + (p.sample ? "" : " ghost");
          tag.textContent = p.sample ? "可试听" : "待生成";
          btn.appendChild(tag);
          btn.addEventListener("click", () => applyPreset(p, true));
          root.appendChild(btn);
        });
      });
    }
    function setMode(mode) {
      state.mode = mode;
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("on", tab.dataset.mode === mode));
      $("captionBox").hidden = mode !== "caption";
      $("simpleBox").hidden = mode !== "simple";
      saveDraft();
    }
    async function refreshHealth() {
      const el = $("status");
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        el.classList.toggle("on", !!data.ok);
        el.querySelector("span").textContent = data.ok ? "生成服务在线" : "生成服务未启动 · 样例仍可听";
      } catch {
        el.classList.remove("on");
        el.querySelector("span").textContent = "页面服务异常";
      }
    }
    function trackButton(item) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "track";
      btn.dataset.url = item.url;
      const b = document.createElement("b");
      b.textContent = item.title;
      const span = document.createElement("span");
      const when = new Date(item.mtime * 1000);
      span.textContent = when.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
      btn.append(b, span);
      btn.addEventListener("click", () => playUrl(item.url, item.title, "本地样例"));
      return btn;
    }
    async function refreshLibrary() {
      const res = await fetch("/api/library");
      const data = await res.json();
      const gen = $("generated");
      const samples = $("samples");
      gen.innerHTML = "";
      samples.innerHTML = "";
      if (!data.generated.length) gen.innerHTML = `<div class="empty">生成完成后会出现在这里</div>`;
      data.generated.forEach((item) => gen.appendChild(trackButton(item)));
      data.samples.forEach((item) => samples.appendChild(trackButton(item)));
      markPlaying();
    }
    function markPlaying() {
      document.querySelectorAll(".track").forEach((el) => el.classList.toggle("on", el.dataset.url === state.playingUrl));
    }
    function ensureAudio() {
      if (audioCtx) return;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
      const src = audioCtx.createMediaElementSource(audio);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      src.connect(analyser);
      analyser.connect(audioCtx.destination);
    }
    function loadTrack(url, title, meta, autoplay) {
      state.playingUrl = url;
      $("trackTitle").textContent = title || "未命名";
      $("trackMeta").textContent = meta || "";
      const abs = new URL(url, location.href).href;
      if (audio.src !== abs) audio.src = url;
      markPlaying();
      if (!autoplay) return;
      ensureAudio();
      const start = () => audio.play().catch(() => toast("浏览器拦住了自动播放，再点一次播放", true));
      if (audioCtx.state === "suspended") audioCtx.resume().then(start);
      else start();
    }
    function draw() {
      const canvas = $("viz");
      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (canvas.width !== Math.floor(w * dpr) || canvas.height !== Math.floor(h * dpr)) {
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      const bars = 42;
      const gap = 4;
      const bw = (w - gap * (bars - 1)) / bars;
      if (analyser && !audio.paused) analyser.getByteFrequencyData(dataArray);
      for (let i = 0; i < bars; i++) {
        let v = 0.08;
        if (analyser && !audio.paused) {
          const idx = Math.floor(Math.pow(i / bars, 1.4) * dataArray.length);
          v = Math.max(0.06, dataArray[idx] / 255);
        } else {
          v = 0.08 + Math.sin(Date.now() / 700 + i * 0.35) * 0.03;
        }
        const bh = v * (h - 24);
        ctx.fillStyle = i % 7 === 0 ? "#ff5d3a" : "#dff25a";
        ctx.fillRect(i * (bw + gap), h - 12 - bh, bw, bh);
      }
      raf = requestAnimationFrame(draw);
    }
    function playUrl(url, title, meta) {
      loadTrack(url, title, meta, true);
    }
    function toggle() {
      if (!audio.src) {
        toast("先点一个可试听的风格", true);
        return;
      }
      ensureAudio();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (audio.paused) audio.play();
      else audio.pause();
    }
    function payload() {
      const preset = catalog.presets.find((p) => p.id === state.presetId);
      return {
        mode: state.mode,
        title: preset ? preset.name : "自定义",
        prompt: $("prompt").value,
        lyrics: $("lyrics").value,
        description: $("description").value,
        bpm: Number($("bpm").value),
        duration: Number($("duration").value),
        language: $("language").value,
        instrumental: $("instrumental").checked,
        thinking: $("thinking").checked,
      };
    }
    async function generate() {
      if (state.timer) return;
      saveDraft();
      const body = payload();
      toast("正在提交…");
      $("gen").disabled = true;
      $("genTop").disabled = true;
      let data;
      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "提交失败");
      } catch (err) {
        toast(err.message || "提交失败", true);
        $("gen").disabled = false;
        $("genTop").disabled = false;
        return;
      }
      state.task = data.task_id;
      state.started = Date.now();
      $("stop").hidden = false;
      toast("已排队，正在生成…");
      state.timer = setInterval(poll, 2500);
      poll();
    }
    async function poll() {
      if (!state.task) return;
      const elapsed = Math.round((Date.now() - state.started) / 1000);
      try {
        const res = await fetch("/api/status", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task_id: state.task, title: payload().title }),
        });
        const data = await res.json();
        if (!data.ok && data.error) throw new Error(data.error);
        if (data.status === 0 || data.status == null) {
          toast("生成中 " + elapsed + " 秒，完成后会自动播放");
          return;
        }
        stopWait();
        if (data.status === 2) {
          toast(data.error || "生成失败", true);
          return;
        }
        const bpm = data.metas && data.metas.bpm ? data.metas.bpm + " 拍 · 刚生成" : "刚生成";
        toast("生成完成");
        await refreshLibrary();
        playUrl(data.url, data.title || payload().title, bpm);
      } catch (err) {
        toast(err.message || "查询失败", true);
      }
    }
    function stopWait() {
      if (state.timer) clearInterval(state.timer);
      state.timer = null;
      state.task = null;
      $("stop").hidden = true;
      $("gen").disabled = false;
      $("genTop").disabled = false;
    }
    audio.addEventListener("play", () => { $("play").textContent = "暂停"; $("play").setAttribute("aria-label", "暂停"); });
    audio.addEventListener("pause", () => { $("play").textContent = "播放"; $("play").setAttribute("aria-label", "播放"); });
    audio.addEventListener("timeupdate", () => {
      $("cur").textContent = fmt(audio.currentTime);
      $("dur").textContent = fmt(audio.duration);
      if (!audio.seeking && Number.isFinite(audio.duration) && audio.duration > 0) {
        $("seek").value = String(Math.round((audio.currentTime / audio.duration) * 1000));
      }
    });
    $("seek").addEventListener("input", () => {
      if (Number.isFinite(audio.duration)) audio.currentTime = (Number($("seek").value) / 1000) * audio.duration;
    });
    $("play").addEventListener("click", toggle);
    $("gen").addEventListener("click", generate);
    $("genTop").addEventListener("click", generate);
    $("stop").addEventListener("click", () => { stopWait(); toast("已停止等待。后台任务如果还在跑，完成后会出现在列表里。"); });
    $("clear").addEventListener("click", () => {
      state.presetId = "";
      $("prompt").value = "";
      $("lyrics").value = "";
      $("description").value = "";
      document.querySelectorAll(".preset").forEach((el) => el.classList.remove("active"));
      saveDraft();
    });
    document.querySelectorAll(".tab").forEach((tab) => tab.addEventListener("click", () => setMode(tab.dataset.mode)));
    ["prompt", "lyrics", "description", "bpm", "duration", "language", "instrumental", "thinking"].forEach((id) => {
      $(id).addEventListener("input", saveDraft);
      $(id).addEventListener("change", saveDraft);
    });
    $("instrumental").addEventListener("change", syncLyricNote);
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); generate(); }
      if (e.code === "Space" && !["TEXTAREA", "INPUT", "SELECT", "BUTTON"].includes(e.target.tagName)) {
        e.preventDefault();
        toggle();
      }
    });
    async function boot() {
      draw();
      const res = await fetch("/api/presets");
      catalog = await res.json();
      renderPresets();
      const saved = localStorage.getItem("beat-studio-draft-v2");
      if (saved) {
        try {
          const d = JSON.parse(saved);
          setMode(d.mode || "caption");
          $("prompt").value = d.prompt || "";
          $("lyrics").value = d.lyrics || "";
          $("description").value = d.description || "";
          $("bpm").value = d.bpm || 120;
          $("duration").value = d.duration || 45;
          $("language").value = d.language || "zh";
          $("instrumental").checked = !!d.instrumental;
          $("thinking").checked = !!d.thinking;
          state.presetId = d.presetId || "";
          document.querySelectorAll(".preset").forEach((el) => el.classList.toggle("active", el.dataset.id === state.presetId));
          const picked = catalog.presets.find((p) => p.id === state.presetId);
          if (picked && picked.sample) loadTrack("/media/" + picked.sample, picked.name, picked.bpm + " 拍 · 样例", false);
          syncLyricNote();
        } catch { applyPreset(catalog.presets[0], false); }
      } else if (catalog.presets[0]) {
        applyPreset(catalog.presets[0], false);
      }
      refreshHealth();
      refreshLibrary();
      setInterval(refreshHealth, 8000);
    }
    boot();
  </script>
</body>
</html>
